[project]
name = "kobo2kindle"
version = "0.1.0"
description = "Get Kobo ebooks onto your Kindle"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "kobodl>=0.13.0",
]

[project.scripts]
kobo2kindle = "kobo2kindle.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kobo2kindle"]
